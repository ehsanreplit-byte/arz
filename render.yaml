services:
  - type: web
    name: arz-panel
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22.14.0"
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false
      - key: AVALAI_API_KEY
        sync: false
      - key: AVALAI_BASE_URL
        value: https://api.avalai.ir/v1
      - key: WEEX_API_KEY
        sync: false
      - key: WEEX_API_SECRET
        sync: false
      - key: WEEX_API_PASSPHRASE
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: SIGNAL_REQUEST_GAP_MS
        value: "30000"
      - key: SIGNAL_MIN_CONSENSUS
        value: "3"
      - key: TRADE_ENTRIES_MODE
        value: "pullback"
      - key: TRADE_MAX_STOP_PCT
        value: "10"
      - key: SIGNAL_AI_BATCH_SIZE
        value: "1"
      - key: SIGNAL_MIN_SCORE_PCT
        value: "50"
      - key: SIGNAL_CYCLE_INTERVAL_MS
        value: "1800000"
      # ---- Trailing stop (حد سود شناور) ----
      - key: WEEX_TRAILING_STOP
        value: "true"
      - key: WEEX_TRAIL_BASIS
        value: roe
      - key: WEEX_TRAIL_BREAKEVEN_PCT
        value: "6"
      - key: WEEX_TRAIL_FIRST_LOCK_PCT
        value: "10"
      - key: WEEX_TRAIL_STEP_PCT
        value: "5"
